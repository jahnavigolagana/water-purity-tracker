{% extends "layout.html" %}

{% block title %}Authentication - Water Purity Tracker for Hostel{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="glass-card text-center p-4 p-md-5" style="max-width: 480px; width: 100%; z-index: 10;">
    
    <div class="mb-4">
      <div class="sidebar-logo-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem; border-radius: 18px;">
        <i class="fas fa-droplet"></i>
      </div>
      <h3 class="fw-bold mb-1 text-white">AquaTrack SaaS</h3>
      <p class="text-muted small">Hostel Water Quality & AI Rule Engine Platform</p>
    </div>

    <!-- Navigation Tabs: Login vs Register -->
    <ul class="nav nav-pills nav-justified mb-4 p-1 rounded-3" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-glass);">
      <li class="nav-item">
        <button class="nav-link active py-2 text-white fw-semibold" id="tabLoginBtn" type="button" onclick="switchAuthTab('login')">
          <i class="fas fa-key me-1"></i> Sign In
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link py-2 text-muted fw-semibold" id="tabRegisterBtn" type="button" onclick="switchAuthTab('register')">
          <i class="fas fa-user-plus me-1"></i> Register Admin
        </button>
      </li>
    </ul>

    <!-- Sign In Form -->
    <form id="loginForm">
      <div class="mb-3 text-start">
        <label class="glass-label" for="usernameInput"><i class="fas fa-user me-1"></i> Username or Email</label>
        <input type="text" class="glass-input" id="usernameInput" placeholder="Enter your username or email" required value="admin">
      </div>

      <div class="mb-3 text-start">
        <label class="glass-label" for="passwordInput"><i class="fas fa-lock me-1"></i> Password</label>
        <div class="position-relative">
          <input type="password" class="glass-input" id="passwordInput" placeholder="Enter your password" required value="admin123">
          <i class="fas fa-eye position-absolute" id="togglePasswordBtn" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4 small">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label text-muted" for="rememberMe">Remember Me</label>
        </div>
        <a href="#" class="text-decoration-none text-info" onclick="showToast('Password reset link sent to registered email', 'info')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-ocean w-100 justify-content-center py-2 fs-6">
        <i class="fas fa-right-to-bracket me-2"></i> Enter Dashboard
      </button>

      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 small text-muted">
        Quick Entry Presets:<br>
        <span class="badge bg-secondary bg-opacity-50 cursor-pointer me-1" onclick="fillPreset('admin', 'admin123')">Admin: admin / admin123</span>
        <span class="badge bg-secondary bg-opacity-50 cursor-pointer" onclick="fillPreset('staff', 'staff123')">Staff: staff / staff123</span>
      </div>
    </form>

    <!-- Self Registration Form for Admin / User -->
    <form id="registerForm" class="d-none">
      <div class="mb-3 text-start">
        <label class="glass-label"><i class="fas fa-id-card me-1"></i> Full Name</label>
        <input type="text" class="glass-input" id="regName" placeholder="e.g. Dr. Anish Kumar" required>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6 text-start">
          <label class="glass-label"><i class="fas fa-user me-1"></i> Username</label>
          <input type="text" class="glass-input" id="regUsername" placeholder="e.g. anish_admin" required>
        </div>
        <div class="col-6 text-start">
          <label class="glass-label"><i class="fas fa-envelope me-1"></i> Email</label>
          <input type="email" class="glass-input" id="regEmail" placeholder="anish@hostel.edu" required>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6 text-start">
          <label class="glass-label"><i class="fas fa-user-shield me-1"></i> Role</label>
          <select class="glass-select" id="regRole">
            <option value="Admin">Admin</option>
            <option value="Hostel Staff">Hostel Staff</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div class="col-6 text-start">
          <label class="glass-label"><i class="fas fa-building me-1"></i> Hostel Block</label>
          <select class="glass-select" id="regBlock">
            <option value="Central Admin">Central Admin</option>
            <option value="Block A - Boys">Block A - Boys</option>
            <option value="Block B - Boys">Block B - Boys</option>
            <option value="Block C - Girls">Block C - Girls</option>
          </select>
        </div>
      </div>

      <div class="mb-4 text-start">
        <label class="glass-label"><i class="fas fa-lock me-1"></i> Set Password</label>
        <input type="password" class="glass-input" id="regPassword" placeholder="Minimum 6 characters" required>
      </div>

      <button type="submit" class="btn-ocean w-100 justify-content-center py-2 fs-6">
        <i class="fas fa-user-check me-2"></i> Register & Access System
      </button>
    </form>

  </div>
</div>

<script>
  function switchAuthTab(tab) {
    const loginForm = document.getElementById('loginForm');
    const regForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLoginBtn');
    const tabReg = document.getElementById('tabRegisterBtn');

    if (tab === 'login') {
      loginForm.classList.remove('d-none');
      regForm.classList.add('d-none');
      tabLogin.classList.add('active');
      tabLogin.classList.remove('text-muted');
      tabReg.classList.remove('active');
      tabReg.classList.add('text-muted');
    } else {
      regForm.classList.remove('d-none');
      loginForm.classList.add('d-none');
      tabReg.classList.add('active');
      tabReg.classList.remove('text-muted');
      tabLogin.classList.remove('active');
      tabLogin.classList.add('text-muted');
    }
  }

  function fillPreset(u, p) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('passwordInput').value = p;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordInput');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwdInput.setAttribute('type', type);
        toggleBtn.className = type === 'password' ? 'fas fa-eye position-absolute' : 'fas fa-eye-slash position-absolute';
      });
    }

    // Register Form Handler
    const regForm = document.getElementById('registerForm');
    if (regForm) {
      regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById('regName').value,
          username: document.getElementById('regUsername').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          role: document.getElementById('regRole').value,
          hostel_block: document.getElementById('regBlock').value
        };

        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            showToast('Account registered successfully! Entering dashboard...', 'success');
            setTimeout(() => window.location.href = data.redirect || '/dashboard', 800);
          } else {
            showToast(data.message || 'Registration error', 'error');
          }
        } catch (err) {
          showToast('Network error during registration', 'error');
        }
      });
    }
  });
</script>
{% endblock %}
